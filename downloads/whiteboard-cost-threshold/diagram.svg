<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1400" viewBox="0 0 1700 1400">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 4 L0 8 z" fill="#0A0A0A"/>
    </marker>
  </defs>

  <!-- canvas -->
  <rect x="0" y="0" width="1700" height="1400" fill="#FFFFFF"/>

  <!-- ===== TITLE ===== -->
  <rect x="66" y="66" width="140" height="140" fill="#0A0A0A"/>
  <rect x="60" y="60" width="140" height="140" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="130" y="163" font-size="92" font-weight="700" fill="#0A0A0A" text-anchor="middle">4</text>

  <text x="230" y="140" font-size="56" font-weight="700" fill="#0A0A0A">成本与门槛</text>
  <text x="230" y="180" font-size="24" fill="#333333">三重输入 × 当场权衡 → 点开或划走</text>

  <!-- ===== COLUMN 1: 成本 (x=60) ===== -->
  <rect x="66" y="246" width="500" height="560" fill="#0A0A0A"/>
  <rect x="60" y="240" width="500" height="110" fill="#F2D4CF"/>
  <rect x="60" y="350" width="500" height="150" fill="#FFFFFF"/>
  <rect x="60" y="500" width="500" height="150" fill="#F5F5F5"/>
  <rect x="60" y="650" width="500" height="150" fill="#FFFFFF"/>
  <rect x="60" y="240" width="500" height="560" fill="none" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="60" y1="350" x2="560" y2="350" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="60" y1="500" x2="560" y2="500" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="60" y1="650" x2="560" y2="650" stroke="#0A0A0A" stroke-width="3"/>

  <rect x="79" y="254" width="90" height="90" fill="#0A0A0A"/>
  <rect x="75" y="250" width="90" height="90" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="120" y="313" font-size="56" font-weight="700" fill="#0A0A0A" text-anchor="middle">1</text>
  <text x="185" y="292" font-size="40" font-weight="700" fill="#0A0A0A">成本</text>
  <text x="185" y="327" font-size="20" fill="#333333">点这条比不点,多付出的代价</text>

  <text x="90" y="400" font-size="26" font-weight="700" fill="#0A0A0A">时间 / 心智成本</text>
  <text x="90" y="443" font-size="22" fill="#333333">深夜弹出,要读半天的长文</text>

  <text x="90" y="550" font-size="26" font-weight="700" fill="#0A0A0A">点前顾虑</text>
  <text x="90" y="593" font-size="22" fill="#333333">一看就像标题党,"八成没料"</text>

  <text x="90" y="700" font-size="26" font-weight="700" fill="#0A0A0A">被打扰成本</text>
  <text x="90" y="743" font-size="22" fill="#333333">正忙时弹进来,"又打断我"</text>

  <!-- ===== COLUMN 2: 阈值 (x=600) ===== -->
  <rect x="606" y="246" width="500" height="560" fill="#0A0A0A"/>
  <rect x="600" y="240" width="500" height="110" fill="#E5EDD6"/>
  <rect x="600" y="350" width="500" height="190" fill="#FFFFFF"/>
  <rect x="600" y="540" width="500" height="70" fill="#FFFFFF"/>
  <rect x="600" y="610" width="500" height="190" fill="#F5F5F5"/>
  <rect x="600" y="240" width="500" height="560" fill="none" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="600" y1="350" x2="1100" y2="350" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="600" y1="540" x2="1100" y2="540" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="600" y1="610" x2="1100" y2="610" stroke="#0A0A0A" stroke-width="3"/>

  <rect x="619" y="254" width="90" height="90" fill="#0A0A0A"/>
  <rect x="615" y="250" width="90" height="90" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="660" y="313" font-size="56" font-weight="700" fill="#0A0A0A" text-anchor="middle">2</text>
  <text x="725" y="292" font-size="40" font-weight="700" fill="#0A0A0A">阈值</text>
  <text x="725" y="327" font-size="20" fill="#333333">同样内容,容忍的代价上限会变</text>

  <text x="630" y="390" font-size="20" fill="#333333">情境:刷手机,闲着</text>
  <text x="630" y="440" font-size="28" font-weight="700" fill="#0A0A0A">附近开了家店</text>
  <text x="630" y="497" font-size="24" font-weight="700" fill="#0A0A0A">→ 随手点开</text>
  <rect x="970" y="470" width="110" height="44" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
  <text x="1025" y="499" font-size="20" font-weight="700" fill="#0A0A0A" text-anchor="middle">门槛低</text>

  <text x="850" y="568" font-size="20" fill="#333333" text-anchor="middle">内容没变,</text>
  <text x="850" y="596" font-size="20" fill="#333333" text-anchor="middle">只是这一刻能容忍的代价上限变了</text>

  <text x="630" y="650" font-size="20" fill="#333333">情境:开会中</text>
  <text x="630" y="700" font-size="28" font-weight="700" fill="#0A0A0A">附近开了家店</text>
  <text x="630" y="757" font-size="24" font-weight="700" fill="#0A0A0A">→ 懒得点</text>
  <rect x="940" y="730" width="140" height="44" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="2"/>
  <text x="1010" y="759" font-size="20" font-weight="700" fill="#0A0A0A" text-anchor="middle">门槛被抬高</text>

  <!-- ===== COLUMN 3: 拦截性状态 (x=1140) ===== -->
  <rect x="1146" y="246" width="500" height="560" fill="#0A0A0A"/>
  <rect x="1140" y="240" width="500" height="110" fill="#F5F5F5"/>
  <rect x="1140" y="350" width="500" height="450" fill="#FFFFFF"/>
  <rect x="1140" y="240" width="500" height="560" fill="none" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="1140" y1="350" x2="1640" y2="350" stroke="#0A0A0A" stroke-width="3"/>

  <rect x="1159" y="254" width="90" height="90" fill="#0A0A0A"/>
  <rect x="1155" y="250" width="90" height="90" fill="#FFFFFF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="1200" y="313" font-size="56" font-weight="700" fill="#0A0A0A" text-anchor="middle">3</text>
  <text x="1265" y="292" font-size="40" font-weight="700" fill="#0A0A0A">拦截性状态</text>
  <text x="1265" y="327" font-size="20" fill="#333333">哪怕东西不错,也直接不点</text>

  <text x="1160" y="400" font-size="24" font-weight="700" fill="#0A0A0A">情境<tspan font-weight="400" fill="#333333">:开车 / 开会 / 陪家人</tspan></text>

  <rect x="1166" y="446" width="460" height="110" fill="#0A0A0A"/>
  <rect x="1160" y="440" width="460" height="110" fill="#F2D4CF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="1390" y="510" font-size="42" font-weight="700" fill="#0A0A0A" text-anchor="middle">现在不方便</text>

  <text x="1160" y="620" font-size="28" font-weight="700" fill="#0A0A0A">不是不值,是不愿</text>
  <text x="1160" y="662" font-size="22" fill="#333333">→ 直接划掉</text>

  <!-- ===== CONVERGENCE ARROWS ===== -->
  <polyline points="310,800 310,860 500,860 500,896" fill="none" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="850" y1="800" x2="850" y2="896" fill="none" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="1390,800 1390,860 1200,860 1200,896" fill="none" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== DECISION NODE ===== -->
  <rect x="306" y="906" width="1100" height="160" fill="#0A0A0A"/>
  <rect x="300" y="900" width="1100" height="160" fill="#FFFFFF"/>
  <rect x="300" y="900" width="220" height="160" fill="#F5F5F5"/>
  <rect x="300" y="900" width="1100" height="160" fill="none" stroke="#0A0A0A" stroke-width="3"/>
  <line x1="520" y1="900" x2="520" y2="1060" stroke="#0A0A0A" stroke-width="3"/>
  <text x="410" y="1002" font-size="60" font-weight="700" fill="#0A0A0A" text-anchor="middle">决策</text>

  <text x="560" y="965" font-size="28" font-weight="700" fill="#0A0A0A">成本 + 阈值 + 拦截性状态 → 当场权衡的结果</text>
  <text x="560" y="1010" font-size="22" fill="#333333">不是第四个独立输入,而是三项汇总后的判断</text>

  <!-- ===== BRANCH ARROWS ===== -->
  <polyline points="850,1060 850,1100 575,1100 575,1136" fill="none" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>
  <polyline points="850,1060 850,1100 1125,1100 1125,1136" fill="none" stroke="#0A0A0A" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- ===== BRANCH CARDS ===== -->
  <rect x="356" y="1146" width="450" height="180" fill="#0A0A0A"/>
  <rect x="350" y="1140" width="450" height="180" fill="#E5EDD6" stroke="#0A0A0A" stroke-width="3"/>
  <text x="575" y="1218" font-size="56" font-weight="700" fill="#0A0A0A" text-anchor="middle">点开</text>
  <text x="575" y="1272" font-size="22" fill="#333333" text-anchor="middle">值得,愿意付这个代价</text>

  <rect x="906" y="1146" width="450" height="180" fill="#0A0A0A"/>
  <rect x="900" y="1140" width="450" height="180" fill="#F2D4CF" stroke="#0A0A0A" stroke-width="3"/>
  <text x="1125" y="1218" font-size="56" font-weight="700" fill="#0A0A0A" text-anchor="middle">划走</text>
  <text x="1125" y="1272" font-size="22" fill="#333333" text-anchor="middle">不值,或此刻不愿意</text>
</svg>
